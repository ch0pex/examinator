<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Examen de Práctica</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Examen de Práctica</h1>

        <div id="start-screen">
            <p>Selecciona el número de preguntas para tu examen:</p>
            <input type="number" id="num-questions" value="10" min="1">
            <label for="immediate-feedback">Retroalimentación inmediata:</label>
            <input type="checkbox" id="immediate-feedback">
            <button id="start-exam">Comenzar Examen</button>
        </div>

        <div id="exam-screen" class="hidden">
            <h2 id="question-counter">Pregunta 1/X</h2>
            <div id="question-container">
                <p id="question-text"></p>
                <div id="options-container">
                    </div>
            </div>
            <button id="next-question">Siguiente Pregunta</button>
             <div id="feedback" class="hidden"></div>
        </div>

        <div id="results-screen" class="hidden">
            <h2>Resultados del Examen</h2>
            <p id="score"></p>
            <h3>Respuestas Correctas:</h3>
            <ul id="correct-answers-list">
                </ul>
             <button id="restart-exam">Reiniciar Examen</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
